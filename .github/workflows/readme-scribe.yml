name: Update README ✨

# Run daily at 01:15 UTC (after grs.yml at 01:00)
on:
  schedule:
    - cron: "15 01 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

# Serialize with grs.yml: both workflows commit to main
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  markscribe:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Check out the tip of main (not the triggering SHA) so a commit pushed by
      # grs.yml while this run waited on the concurrency group is included
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: muesli/readme-scribe@master
        env:
          GITHUB_TOKEN: ${{ secrets.SCRIBE_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update generated README"
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
